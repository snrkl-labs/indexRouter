pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

// Build-system project name only — NOT a user-facing identity string.
// The app's display name lives in app/src/main/res/values/strings.xml (app_name);
// the application ID lives in gradle.properties (indexrouter.applicationId).
rootProject.name = "PebbleIndexRouter"
include ':app'
