org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# App identity — SINGLE SOURCE OF TRUTH for the application ID.
#
# Identity is confined to exactly two places, so a rename stays a small,
# localised change:
#
#   1. indexrouter.applicationId (below) — the install identity.
#   2. res/values/strings.xml -> app_name — the display name.
#
# Nothing else in the codebase may restate either value; notification channel
# names, log tags and window titles all resolve from app_name.
#
# WARNING: changing applicationId after install makes it a DIFFERENT app to
# Android — it installs alongside rather than upgrading, and the old app's data
# is not carried over. Display name can be changed freely at any time.
# ---------------------------------------------------------------------------
indexrouter.applicationId=org.snrkl.indexrouter
indexrouter.versionCode=23
indexrouter.versionName=0.17.0

# Room 2.6.1's annotation processor is not KSP2-clean (fails with "unexpected jvm
# signature V" on Kotlin 2.2). Pin the KSP1 backend rather than dragging Room to
# a version that would force a compileSdk bump.
ksp.useKSP2=false
